      <path d="M80 310V322H106V307H94L91 303H80Z M80 310H106" fill="#9bc9e6" fill-opacity=".13" stroke="#add3eb" />
      <path d="M176 302H187L193 308V324H176Z M187 302V308H193M180 313H189M180 318H187" fill="#b4b8ee" fill-opacity=".13" stroke="#bcc8ec" />
      <path d="M267 308L274 319L281 308M267 308H281" stroke="#9dd8d1" />
      <circle cx="267" cy="307" r="3.7" fill="#234659" stroke="#9dd8d1" />
      <circle cx="281" cy="307" r="3.7" fill="#234659" stroke="#9dd8d1" />
      <circle cx="274" cy="320" r="3.7" fill="#234659" stroke="#9dd8d1" />
    </g>
    <g font-size="15" fill="#d3e1ee" text-anchor="middle">
      <text x="93" y="344">Gather<tspan x="93" dy="17">materials</tspan>
      </text>
      <text x="184" y="344">Draft<tspan x="184" dy="17">the plan</tspan>
      </text>
      <text x="274" y="344">Coordinate<tspan x="274" dy="17">delivery</tspan>
      </text>
    </g>
    <path d="M60 380H307" stroke="#9ab7cd" stroke-opacity=".22" />
    <g stroke="#a9c6d9" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 392H69L76 399V412H60ZM69 392V399H76M64 403H72M64 407H72" />
    </g>
    <text x="89" y="409" font-size="19" font-weight="500" fill="#d7e6f2">Delivery plan.pdf</text>
