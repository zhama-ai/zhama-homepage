<svg xmlns="http://www.w3.org/2000/svg" class="workspace-outcomes" width="681" height="630" viewBox="0 0 681 630" fill="none" role="img" aria-label="Business outcomes: a business delivery plan, revenue trends, archived contracts and attachments, and customer follow-up." font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="outcome-proposal-fill" x2="85%" y2="100%">
      <stop stop-color="#435b78" stop-opacity=".96" />
      <stop offset=".62" stop-color="#2b4563" stop-opacity=".91" />
      <stop offset="1" stop-color="#192e49" stop-opacity=".86" />
    </linearGradient>
    <linearGradient id="outcome-analysis-fill" x2="75%" y2="100%">
      <stop stop-color="#284c60" stop-opacity=".89" />
      <stop offset="1" stop-color="#12293e" stop-opacity=".82" />
    </linearGradient>
    <linearGradient id="outcome-area-fill" x2="0%" y2="100%">
      <stop stop-color="#73c8cc" stop-opacity=".32" />
      <stop offset="1" stop-color="#73c8cc" stop-opacity=".015" />
    </linearGradient>
    <linearGradient id="outcome-edge" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop stop-color="#b3cbe1" stop-opacity=".72" />
      <stop offset=".48" stop-color="#6a8da9" stop-opacity=".48" />
      <stop offset="1" stop-color="#3c5975" stop-opacity=".35" />
    </linearGradient>
    <linearGradient id="outcome-summary-fill" x1="0%" y1="0%" x2="95%" y2="100%">
      <stop stop-color="#2a425d" stop-opacity=".76" />
      <stop offset="1" stop-color="#14273b" stop-opacity=".62" />
    </linearGradient>
    <radialGradient id="outcome-environment" cx="50%" cy="50%" r="50%">
      <stop stop-color="#3a5e88" stop-opacity=".17" />
      <stop offset=".58" stop-color="#29486c" stop-opacity=".10" />
      <stop offset="1" stop-color="#1c3451" stop-opacity="0" />
    </radialGradient>
    <filter id="outcome-main-shadow" x="-28%" y="-20%" width="166%" height="174%" color-interpolation-filters="sRGB">
      <feDropShadow dx="8" dy="23" stdDeviation="14" flood-color="#00030a" flood-opacity=".76" />
      <feDropShadow dx="1" dy="4" stdDeviation="3" flood-color="#00030a" flood-opacity=".62" />
    </filter>
    <filter id="outcome-rear-shadow" x="-25%" y="-20%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="5" dy="15" stdDeviation="11" flood-color="#00040c" flood-opacity=".62" />
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#00040c" flood-opacity=".46" />
    </filter>
    <filter id="outcome-summary-shadow" x="-15%" y="-30%" width="135%" height="210%" color-interpolation-filters="sRGB">
      <feDropShadow dx="4" dy="17" stdDeviation="12" flood-color="#00040c" flood-opacity=".64" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00040c" flood-opacity=".38" />
    </filter>
  </defs>
  <ellipse cx="344" cy="346" rx="331" ry="280" fill="url(#outcome-environment)" />
  <text x="36" y="49" font-size="25" font-weight="500" fill="#c0d4e4">Business outcomes</text>
