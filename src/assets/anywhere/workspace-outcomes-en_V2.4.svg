    <path d="M59 479Q59 476 62 476H67L71 480H78Q81 480 81 483V491Q81 494 78 494H62Q59 494 59 491Z" fill="#8995c9" fill-opacity=".28" stroke="#bbc4e6" stroke-width="1.65" stroke-linejoin="round" />
    <path d="M65 487L68.5 490L75 484" stroke="#bbc4e6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="89" y="491" font-size="19" font-weight="500" fill="#b8d0e2">Archived files</text>
    <text x="60" y="526" font-size="18" font-weight="500" fill="#d9e8f3">Contracts &amp; attachments filed</text>
