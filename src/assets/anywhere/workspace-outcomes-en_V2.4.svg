    <text x="85" y="557" font-size="17" fill="#a8bfd3">Archive log.xlsx</text>
  </g>
  <g id="outcome-follow-up">
    <g stroke="#9bd6ce" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
      <path d="M378 475H392Q396 475 396 479V486Q396 490 392 490H384L378 494V490Q374 490 374 486V479Q374 475 378 475Z" />
      <path d="M380 483H380.1M385 483H385.1M390 483H390.1" stroke-width="2.2" />
