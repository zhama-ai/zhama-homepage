    <text x="404" y="491" font-size="19" font-weight="500" fill="#b8d0e2">Customer follow-up</text>
    <text font-size="19" font-weight="500" fill="#d9e8f3">
      <tspan x="375" y="526">Proposal and materials</tspan>
      <tspan x="375" y="552">checklist are ready</tspan>
    </text>
