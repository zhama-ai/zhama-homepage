    <path d="M409 295.5L457 251.5L505 262.7L553 241.5L601 223.5V372H409Z" fill="url(#outcome-area-fill)" />
    <path d="M401 201V372H619" stroke="#789bb6" stroke-opacity=".7" stroke-width="1.2" />
    <path d="M601 224V371" stroke="#99d9d3" stroke-opacity=".38" stroke-dasharray="3 5" />
    <path d="M409 295.5L457 251.5L505 262.7L553 241.5L601 223.5" stroke="#86d6d1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <g fill="#9fe2dc">
      <circle cx="409" cy="295.5" r="3.6" />
      <circle cx="457" cy="251.5" r="3.6" />
      <circle cx="505" cy="262.7" r="3.6" />
      <circle cx="553" cy="241.5" r="3.6" />
    </g>
    <circle cx="601" cy="223.5" r="5.7" fill="#184151" stroke="#abede4" stroke-width="2.2" />
    <text font-size="16" fill="#aec4d6" text-anchor="end">
      <tspan x="393" y="210">100</tspan>
      <tspan x="393" y="294">50</tspan>
      <tspan x="393" y="378">0</tspan>
    </text>
    <text font-size="16" fill="#aec4d6" text-anchor="middle">
      <tspan x="409" y="401">Jul</tspan>
      <tspan x="457" y="401">Aug</tspan>
      <tspan x="505" y="401">Sep</tspan>
      <tspan x="553" y="401">Oct</tspan>
      <tspan x="601" y="401">Nov</tspan>
    </text>
  </g>
  <rect x="36" y="452" width="609" height="137" rx="12" fill="url(#outcome-summary-fill)" stroke="url(#outcome-edge)" stroke-opacity=".6" stroke-width="1.2" filter="url(#outcome-summary-shadow)" />
  <path d="M341 473V568" stroke="#8ba9c0" stroke-opacity=".23" />
