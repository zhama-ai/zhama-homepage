# Include inside the existing www.zhama.com.cn TLS server block.
location ^~ /api/release-cache/ {
    # Docker DNS re-resolves the service after container replacement.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $release_cache_backend release-cache:3000;
    rewrite ^/api/release-cache/(.*)$ /$1 break;
    proxy_pass http://$release_cache_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
}
