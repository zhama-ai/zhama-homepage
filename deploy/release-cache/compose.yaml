name: zhama-release-cache
services:
  release-cache:
    build:
      context: ../..
      dockerfile: deploy/release-cache/Dockerfile
    restart: unless-stopped
    init: true
    volumes:
      - release-data:/data
    networks:
      - nginx
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 25s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  release-data:
networks:
  nginx:
    external: true
    name: nginx_default
