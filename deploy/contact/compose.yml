services:
  contact:
    build:
      context: ../..
      dockerfile: deploy/contact/Dockerfile
    env_file:
      - ../../.env.contact.local
    environment:
      NODE_ENV: production
      CONTACT_HOST: 0.0.0.0
      CONTACT_PORT: 4351
      CONTACT_ALLOWED_ORIGINS: https://www.zhama.com,https://zhama.com
      CONTACT_TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:4351:4351"
    volumes:
      - contact-leads:/app/.contact-data
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  contact-leads:
