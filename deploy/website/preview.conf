server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ready\n";
    }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location ~ ^/api/contact/?$ {
        gzip off;
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        proxy_pass http://contact:4351;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ /\. { return 404; }
    location /_astro/ {
        expires 1d;
        try_files $uri =404;
    }
    include /etc/nginx/preview-routes.conf;
}
