# Production server for the website image. The host's edge Nginx terminates TLS
# and forwards to this container over the shared Docker network.

# The edge proxy sets X-Forwarded-Proto; canonical redirects compare against it.
map $http_x_forwarded_proto $site_scheme {
    default $scheme;
    https https;
}

# Hosts served in place; any other host is redirected to https://www.zhama.com.
# zhama.ai serves www.zhama.com, the zhama.com.cn host serves the .cn names.
map $host $site_served_host {
    default 0;
    www.zhama.com 1;
    zhama.com.cn 1;
    www.zhama.com.cn 1;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    # Only the edge proxy reaches this container, over private Docker networks.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ready\n";
    }

    location ~ ^/api/contact/?$ {
        gzip off;
        client_max_body_size 48k;
        client_body_timeout 10s;
        proxy_pass http://contact:4351;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $site_scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
    }

    location ~ /\. { return 404; }

    # Astro emits content-hashed file names under /_astro/.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    include /etc/nginx/site-routes.conf;
}
