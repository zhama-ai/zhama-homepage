# Production server for the website image. The host's edge Nginx terminates TLS
# and forwards to this container over the shared Docker network.
# Each image is built for one canonical origin (PUBLIC_SITE_URL): the generated
# site-routes.conf serves that host and redirects every other host to it.

# The edge proxy sets X-Forwarded-Proto; canonical redirects compare against it.
map $http_x_forwarded_proto $site_scheme {
    default $scheme;
    https https;
}

# Contact submissions per visitor address (after real_ip), ahead of the service's own limit.
limit_req_zone $binary_remote_addr zone=contact:10m rate=10r/m;

# HSTS only on responses the edge delivered over HTTPS.
map $site_scheme $site_hsts {
    https "max-age=31536000";
    default "";
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    # Only the edge proxy reaches this container, over private Docker networks.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ready\n";
    }

    location ~ ^/api/contact/?$ {
        gzip off;
        limit_req zone=contact burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 48k;
        client_body_timeout 10s;
        proxy_pass http://contact:4351;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $site_scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
    }

    location ~ /\. { return 404; }

    # Security headers, /_astro/ caching, /api/builds and every page route.
    include /etc/nginx/site-routes.conf;
}
